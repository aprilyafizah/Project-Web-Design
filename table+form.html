<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>

<body>

<table border="1" cellspacing="0" cellpadding="8">

    <tr>
        <td>
            Nama :
            <input type="text">
        </td>
    </tr>

    <tr>
        <td>
            Kelas :
            <input type="text">
        </td>
    </tr>

    <tr>
        <td>
            Laki - Laki
            <input type="radio" name="radio" checked>

            Perempuan
            <input type="radio" name="radio">
        </td>
    </tr>

    <tr>
        <td>
            izin
            <input type="checkbox" checked>

            sakit
            <input type="checkbox" checked>

            dispensasi
            <input type="checkbox" checked>
        </td>
    </tr>

    <tr>
        <td>
            Jurusan :
            <select>
                <option>Rekayasa Perangkat Lunak 1</option>
                <option>Rekayasa Perangkat Lunak 2</option>
                <option>Layanan Perbankan 1</option>
                <option>Layanan Perbankan 2</option>
                <option>Manajemen Perkantoran 1</option>
                <option>Manajemen Perkantoran 2</option>
                <option>Manajemen Perkantoran 3</option>
                <option>Manajemen Perkantoran 4</option>
                <option>Akuntansi 1</option>
                <option>Akuntansi 2</option>
                <option>Akuntansi 3</option>
                <option>Bisnis Digital 1</option>
                <option>Bisnis Digital 2</option>
                <option>Bisnis Digital 3</option>
                <option>Bisnis Digital 4</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>
            Penjelasan :
            <br>
            <textarea rows="5" cols="30"></textarea>
        </td>
    </tr>

    <tr>
        <td>
            <button type="button">Button</button>
        </td>
    </tr>

</table>

</body>
</html>
